server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/excel_import}
    username: ${DB_USERNAME:excel_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
  application:
    name: excel-import-starter
  servlet:
    multipart:
      max-file-size: 10MB
      # Cho phep them multipart headers/boundary ngoai dung luong file.
      max-request-size: 11MB
