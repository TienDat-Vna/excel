services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: excel_import
      MYSQL_USER: excel_app
      MYSQL_PASSWORD: ${DB_PASSWORD:12345}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:12345}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
